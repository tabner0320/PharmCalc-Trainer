<!-- ========================= -->
<!-- ORAL SYRINGE PRACTICE -->
<!-- ========================= -->

<section class="calculator-card">

    <h2>
        Oral Syringe Practice
    </h2>

    <p>
        Practice selecting the correct volume
        on a 5 mL oral syringe.
    </p>


    <div class="device-score-box">

        <strong>Score:</strong>

        <span id="syringeScoreDisplay">
            0 / 0
        </span>

    </div>


    <div class="device-question">

        <h3>
            Measure:
            <span id="syringeTargetVolume">
                --
            </span>
            mL
        </h3>

        <p>
            Click the correct measurement line
            on the syringe.
        </p>

    </div>


    <div class="syringe-practice-area">

        <div class="syringe-wrapper">

            <div class="syringe-plunger-handle">
            </div>

            <div class="syringe-plunger-rod">
            </div>


            <div class="syringe-barrel">

                <div
                    id="syringeLiquid"
                    class="syringe-liquid"
                >
                </div>


                <button
                    class="syringe-mark mark-05"
                    data-volume="0.5"
                    aria-label="0.5 milliliters"
                >
                </button>

                <button
                    class="syringe-mark major mark-1"
                    data-volume="1"
                    aria-label="1 milliliter"
                >
                    <span>1</span>
                </button>

                <button
                    class="syringe-mark mark-15"
                    data-volume="1.5"
                    aria-label="1.5 milliliters"
                >
                </button>

                <button
                    class="syringe-mark major mark-2"
                    data-volume="2"
                    aria-label="2 milliliters"
                >
                    <span>2</span>
                </button>

                <button
                    class="syringe-mark mark-25"
                    data-volume="2.5"
                    aria-label="2.5 milliliters"
                >
                </button>

                <button
                    class="syringe-mark major mark-3"
                    data-volume="3"
                    aria-label="3 milliliters"
                >
                    <span>3</span>
                </button>

                <button
                    class="syringe-mark mark-35"
                    data-volume="3.5"
                    aria-label="3.5 milliliters"
                >
                </button>

                <button
                    class="syringe-mark major mark-4"
                    data-volume="4"
                    aria-label="4 milliliters"
                >
                    <span>4</span>
                </button>

                <button
                    class="syringe-mark mark-45"
                    data-volume="4.5"
                    aria-label="4.5 milliliters"
                >
                </button>

                <button
                    class="syringe-mark major mark-5"
                    data-volume="5"
                    aria-label="5 milliliters"
                >
                    <span>5</span>
                </button>

            </div>


            <div class="syringe-tip-base">
            </div>

            <div class="syringe-tip">
            </div>

        </div>


        <p class="syringe-unit">
            mL
        </p>

    </div>


    <p id="selectedSyringeVolumeText">
        Selected volume: None
    </p>


    <div class="practice-buttons">

        <button id="checkSyringeButton">
            Check Answer
        </button>

        <button id="newSyringeProblemButton">
            New Problem
        </button>

        <button id="showSyringeAnswerButton">
            Show Answer
        </button>

    </div>


    <button id="resetSyringeScoreButton">
        Reset Score
    </button>


    <div
        id="syringeResult"
        class="result"
    >
    </div>

</section>
